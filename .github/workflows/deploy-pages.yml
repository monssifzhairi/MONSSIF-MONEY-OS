name: Deploy to GitHub Pages

# Builds the production bundle and deploys it to GitHub Pages.
# Runs on every push to the session branch, or manually via workflow_dispatch.
on:
  push:
    branches: [arena/29fb6e20-monssif-money-os]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Deploy gates: a failing suite must block the release.
      - name: Tests
        run: npm test

      # Project site lives at https://OWNER.github.io/MONSSIF-MONEY-OS/
      - name: Build (sub-path base)
        run: npx vite build --base=/MONSSIF-MONEY-OS/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Settings → Pages → Source: GitHub Actions) from
          # within the run. Per this action's contract this REQUIRES a token
          # other than GITHUB_TOKEN — store a classic PAT with the `repo`
          # scope (or a fine-grained token with Pages: write) as the repository
          # secret PAGES_ADMIN_TOKEN and this step enables + deploys hands-free.
          # If the secret is absent, the default GITHUB_TOKEN is used and Pages
          # must be enabled manually once in Settings → Pages.
          enablement: true
          token: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Print an actionable fix if the build job failed at Pages setup.
  explain-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: How to fix Pages enablement
        run: |
          echo "::error::GitHub Pages is not enabled for this repository. Fix (one click): Settings → Pages → Source: GitHub Actions — then re-run this workflow. Alternative (hands-free): add a repository secret PAGES_ADMIN_TOKEN containing a PAT with the 'repo' scope; the workflow will then enable Pages by itself via actions/configure-pages enablement."
